name: Bug Report
description: Worker、Queue、D1、管理画面などの不具合を報告します
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      placeholder: 例: `/admin/youtube-update` 実行後に Queue は流れるが `lives.json` が更新されない
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. `/admin` にログインする
        2. `youtube-update` を実行する
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: 関連しそうな領域
      options:
        - label: Admin
        - label: WebSub
        - label: RSS
        - label: YouTube Data API
        - label: D1
        - label: KV
        - label: Queue
        - label: Durable Object
  - type: textarea
    id: logs
    attributes:
      label: ログ・レスポンス
      render: text
  - type: textarea
    id: environment
    attributes:
      label: 環境・設定
      description: Wrangler、Cloudflare 設定、再現条件など
      placeholder: |
        - Wrangler 4.x
        - 実行経路: scheduled / queue / admin
        - 対象 endpoint:

